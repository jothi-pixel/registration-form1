<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-wrapper">
        <h2>Registration Form</h2>

        <form>
            <label>Full Name:</label>
            <input type="text">

            <label>Email:</label>
            <input type="email">

            <label>Password:</label>
            <input type="password">

            <label>Phone:</label>
            <input type="tel">            
          


            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
